[project]
name = "bar-forge"
version = "0.1.0"
description = "Activity-based market data bars and strictly causal normalisation transforms."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Bert Mouler" }]
keywords = [
    "bars",
    "dollar-bars",
    "feature-engineering",
    "market-microstructure",
    "quantitative-finance",
    "sampling",
    "volume-bars",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.urls]
Homepage = "https://github.com/bmouler/bar-forge"
Repository = "https://github.com/bmouler/bar-forge"

[project.scripts]
bar-forge = "bar_forge.cli:main"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bar_forge"]
