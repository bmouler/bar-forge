[project]
name = "bar-forge"
version = "1.0.0"
description = "Activity-based market data bars and strictly causal normalisation transforms."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Bert Mouler" }]
keywords = [
    "bars",
    "dollar-bars",
    "feature-engineering",
    "market-microstructure",
    "quantitative-finance",
    "sampling",
    "volume-bars",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.100",
    "mutmut>=3.7",
    "mypy>=1.14",
    "pytest",
    "pytest-cov",
    "ruff",
]

[project.urls]
Homepage = "https://github.com/bmouler/bar-forge"
Repository = "https://github.com/bmouler/bar-forge"

[project.scripts]
bar-forge = "bar_forge.cli:main"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src"]
python_version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["bar_forge"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true

[tool.mutmut]
source_paths = ["src/bar_forge"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bar_forge"]
